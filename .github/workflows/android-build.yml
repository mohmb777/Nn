name: بناء تطبيق ASTRA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: اختبارات وبناء APK تجريبي
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
